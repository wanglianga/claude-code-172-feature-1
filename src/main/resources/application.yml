server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: robot-delivery
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:robot_delivery}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: robot-delivery
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true

# 配送业务参数（均可通过环境变量覆盖，便于演示超时类异常）
delivery:
  pickup-timeout-seconds: ${PICKUP_TIMEOUT_SECONDS:600}      # 用户超时不取（默认10分钟）
  coldchain-timeout-seconds: ${COLDCHAIN_TIMEOUT_SECONDS:2700} # 冷藏订单履约时限（默认45分钟）
  elevator-timeout-seconds: ${ELEVATOR_TIMEOUT_SECONDS:180}   # 电梯请求超时（默认3分钟）
  low-battery-threshold: ${LOW_BATTERY_THRESHOLD:20}          # 低电量阈值（%）
  scheduler-interval-ms: ${SCHEDULER_INTERVAL_MS:10000}       # 超时巡检间隔
  scheduler-enabled: ${SCHEDULER_ENABLED:true}
  # 电梯满载等待策略
  elevator-full-threshold: ${ELEVATOR_FULL_THRESHOLD:3}       # 连续满载几次后触发策略判定
  urgent-window-seconds: ${URGENT_WINDOW_SECONDS:600}         # 距时效截止不足该秒数视为紧迫
  high-floor-threshold: ${HIGH_FLOOR_THRESHOLD:10}           # 目标楼层不低于该值视为高楼
  downstairs-timeout-seconds: ${DOWNSTAIRS_TIMEOUT_SECONDS:${PICKUP_TIMEOUT_SECONDS:600}} # 用户下楼取件超时
  relay-sla-seconds: ${RELAY_SLA_SECONDS:300}                               # 人工接力配送时效（接货到送达）
  # 配送费用（分）
  base-fee-cents: ${BASE_FEE_CENTS:500}                       # 基础配送费（默认5元）
  per-floor-fee-cents: ${PER_FLOOR_FEE_CENTS:30}              # 每层加价（默认3角）
  cold-chain-fee-cents: ${COLD_CHAIN_FEE_CENTS:200}            # 冷藏附加费（默认2元）
  relay-surcharge-cents: ${RELAY_SURCHARGE_CENTS:300}          # 人工接力附加费（默认3元，平台侧原因触发免收）

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.apache.kafka: warn
    org.springframework.kafka: warn
